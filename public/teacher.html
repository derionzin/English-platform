<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="login" class="card">
    <h1>Teacher login</h1>
    <form id="loginForm">
        <input type="password" id="password" placeholder="Password" required>
        <button>Log in</button>
    </form>
    <p id="loginError" class="error"></p>
    <p class="teacher-link"><a href="/">Back to student page</a></p>
  </section>
  <section id="panel" hidden>
    <header class="bar">
      <strong>Teacher panel</strong>
      <button id="logout" class="link">Log out</button>
    </header>
    <div class="grid">
      <div class="col">
        <h2>Students</h2>
        <form id="studentForm">
          <input type="text" id="studentName" placeholder="New student name" required>
          <button>Add student</button>
        </form>
        <ul id="students"></ul>
      </div>
      <div class="col">
        <h2>Lessons</h2>
        <form id="lessonForm">
          <input type="text" id="lessonTitle" placeholder="Lesson title" required>
          <div id="blocks"></div>
          <div class="row add-row">
            <button type="button" data-add="text">+ Text</button>
            <button type="button" data-add="choice">+ Multiple choice</button>
            <button type="button" data-add="open">+ Open question</button>
            <button type="button" data-add="reveal">+ Hidden text</button>
          </div>
          <button id="lessonSubmit">Add lesson</button>
          <button type="button" id="lessonCancel" class="link" hidden>Cancel editing</button>
        </form>
        <ul id="lessons"></ul>
      </div>
      <div class="col">
        <h2 id="unlockTitle">Student lessons</h2>
        <p id="unlockHint" class="muted">Select a student to manage their lessons.</p>
        <div id="unlockPanel" hidden>
            <form id="headerForm">
              <input type="text" id="headerTitle" class="grow" placeholder="New header (e.g. Unit 1: Greetings)" required>
              <button>Add header</button>
            </form>
            <h3>Unlocked (in the order they see them)</h3>
            <ul id="unlocked"></ul>
            <h3>Locked</h3>
            <ul id="locked"></ul>
        </div>
    </div>
    </div>
  </section>
  <script src="js/teacher.js"></script>
</body>
</html>
